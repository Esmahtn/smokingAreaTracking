# YOLOv8 ByteTrack Yapılandırma Dosyası
# Kıpraşma ve geçici kapanmalar (occlusion) sırasında ID kaybını önlemek için optimize edilmiştir.

tracker_type: bytetrack

# Yüksek güven eşiği — sahte tespitleri filtreler
track_high_thresh: 0.45

# Düşük güven kısmı — kısa süreli kapanmalarda izi korur
track_low_thresh: 0.10

# Yeni iz açmak için gereken minimum güven (düşürüldü - daha kolay yeni track)
new_track_thresh: 0.45

# Kaybolan izi hafızada tutma süresi (kare sayısı)
# 30 FPS'de 120 kare = 4 saniye → daha uzun hafıza
track_buffer: 120

# IoU eşik: düşüldü → daha toleranslı eşleşme (postür değişiklikleri için)
match_thresh: 0.6

fuse_score: False
